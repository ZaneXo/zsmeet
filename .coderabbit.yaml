# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit 给 PR 做 AI 代码审查。它是一个 GitHub App，不跑在 Actions 里：仓库管理员在 coderabbit.ai
# 用 GitHub 登录、把这个仓库加进去以后，每个 PR 自动审查（见 README「代码审查」一节）。
# 完整的配置项见 https://docs.coderabbit.ai/reference/configuration

language: zh-CN
tone_instructions: 用简洁的中文说清楚问题：在什么输入或状态下会出错、后果是什么、怎么改。不要客套话，不要泛泛的建议，没把握的问题标明是推测。

reviews:
  profile: chill
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false

  # 生成的文件不审：改它们的源头（SQL、接口定义），再 make gen
  path_filters:
    - "!internal/db/sqlc/**"
    - "!web/openapi.json"
    - "!web/src/api/schema.d.ts"
    - "!web/pnpm-lock.yaml"
    - "!go.sum"

  path_instructions:
    - path: "**/*"
      instructions: |
        项目约定（README「几条约定」）：
        - 给用户看的文字（报错、提示、界面文案）都是能照着处理的中文，不把内部报错直接抛给用户。
        - 不在日志、报错、接口返回里带出密钥：大模型的 API Key、飞书的 App Secret、ZSMEET_SECRET_KEY 等。
        - 生成的文件（sqlc 的代码、openapi.json、schema.d.ts）要和源头一起改、一起提交（make gen）。
    - path: "internal/api/**"
      instructions: |
        接口层（huma v2）。huma 只能出现在 internal/api 里（internal/arch 有测试守着），业务逻辑放在 internal/service。
        读写会议数据的接口都要带上当前用户，交给 service 按权限检查（internal/service/access.go 的 Access：看、编辑、管理）。
        看不到的会议一律当作不存在（404），不能用 403 或者别的方式泄露它的存在、标题和内容。
    - path: "internal/service/**"
      instructions: |
        业务逻辑。会议的权限规则：管理员和创建者什么都能做；可见范围 team 所有成员能看，members 只有单独指定的人能看，
        private 只有创建者（和管理员）能看；指定能编辑的人可以改纪要、重新生成、改标题、给说话人改名、发到飞书；
        删除、恢复、改可见范围、上传录音只有创建者和管理员能做。搜索结果和搜索词扩展也不能带出看不到的会议。
        检查完权限、再在另一个事务里修改时，注意中间状态被别人改掉的竞态（必要时 LockMeeting 或在同一个事务里重新检查）。
    - path: "internal/db/migrations/**"
      instructions: |
        goose 迁移。已经发布过的迁移不能改，只能加新的；每个迁移都要有能用的 Down。
        升级时库里已经有数据：加 NOT NULL 列要有默认值，改约束要考虑旧数据。
    - path: "internal/db/queries/**"
      instructions: |
        sqlc 查询。列出会议的查询要按 viewer 的可见范围过滤（和 ListMeetings 的写法一致）。
        ANY / unnest 传进来的数组可能是空的；NULL 和空数组的语义不一样。
    - path: "internal/pipeline/**"
      instructions: |
        后台处理（River 队列）。同一场会议可能被重新排队：写结果前要用 run_id 确认这一轮还有效，过期的一轮不能改数据。
        任务会重试：每一步要能重复执行，失败要区分能重试的和不能重试的（permanent）。
    - path: "web/src/**"
      instructions: |
        React + TanStack Query。站内链接用 web/src/components/AppLink.tsx 的 AppLink，不直接用 react-router 的 Link。
        接口类型来自生成的 web/src/api/schema.d.ts。按钮和入口按接口返回的 can_edit / can_manage 显示，不在前端自己判断角色。
    - path: ".github/workflows/**"
      instructions: |
        GitHub Actions。识别库 sherpa-onnx 通过 cgo 调用，镜像在 amd64、arm64 的机器上各自构建，不交叉编译。
        权限按需最小化；第三方 Action 用官方维护的。

  tools:
    # 对中文文档、带 sqlc 占位符的 SQL 误报太多
    languagetool:
      enabled: false
    sqlfluff:
      enabled: false

chat:
  auto_reply: true
